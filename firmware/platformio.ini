; MakroPad firmware (ESP32-S3-DevKitC-1).
; Build:        pio run
; Flash:        pio run -t upload
; Host tests:   pio test -e native

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Uploads over the native USB port: a 1200-baud touch reboots into the ROM bootloader.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; Native USB in TinyUSB mode so CDC (protocol) and HID (fallback) enumerate together.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
test_ignore = *

; Pure logic in lib/makropad_core is tested on the host. Requires a host gcc/g++.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
